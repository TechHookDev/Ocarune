name: Build problem
description: The installer or make_game.py stops or gives an error
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you start: check the [newest release](https://github.com/TechHookDev/Hylia/releases/latest) and the [build requirements](https://github.com/TechHookDev/Hylia#requirements) (Windows 10/11 x64, about 20 GB free), and search the open issues. English, please. Never attach game files.
  - type: input
    id: version
    attributes:
      label: Hylia version
      description: The release you downloaded (on the Releases page).
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you built
      options:
        - Setup.exe installer (Windows)
        - Command line (nx2/make_game.py)
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Game files given to it
      options:
        - A .nup
        - romfs and exefs folders
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The error
      description: Copy the text the installer shows, with the failed step's details (text, not a screenshot of it).
      render: text
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Which step failed
      description: Download tools, Prepare Python, Check your game file or Build the game.
  - type: input
    id: system
    attributes:
      label: Operating system and free space on the output drive
      placeholder: "Windows 11 24H2, 210 GB free on D:"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I'm on the newest release, or it still fails on it.
          required: true
        - label: I searched the open issues for this error.
          required: true
        - label: I'm not attaching game files or anything built from them.
          required: true
